<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14060b">
  <title>Покер вдвоём</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow"></div>

  <!-- ЛОББИ -->
  <section id="screen-lobby" class="screen">
    <div class="lobby-card">
      <div class="logo-suits"><span>♠</span><span class="r">♥</span><span class="r">♦</span><span>♣</span></div>
      <h1>Покер <em>вдвоём</em></h1>
      <p class="sub">Техасский холдем один на один</p>

      <div id="lobby-create" hidden>
        <label class="field">Твоё имя<input id="in-host-name" maxlength="16" placeholder="Как тебя зовут?" autocomplete="off"></label>
        <div class="row">
          <label class="field">Стек
            <select id="in-stack">
              <option value="1000">1 000</option>
              <option value="2000" selected>2 000</option>
              <option value="5000">5 000</option>
            </select>
          </label>
          <label class="field">Блайнды
            <select id="in-blinds">
              <option value="5/10">5 / 10</option>
              <option value="10/20" selected>10 / 20</option>
              <option value="25/50">25 / 50</option>
            </select>
          </label>
        </div>
        <button class="btn btn-gold big" id="btn-create">Создать стол</button>
      </div>

      <div id="lobby-join" hidden>
        <p class="invite">Тебя пригласили за стол ♥</p>
        <label class="field">Твоё имя<input id="in-guest-name" maxlength="16" placeholder="Как тебя зовут?" autocomplete="off"></label>
        <button class="btn btn-gold big" id="btn-join">Сесть за стол</button>
      </div>

      <div id="lobby-wait" hidden>
        <p class="invite">Отправь эту ссылку:</p>
        <div class="link-box">
          <input id="share-link" readonly>
          <button class="btn btn-small" id="btn-copy">Копировать</button>
        </div>
        <div class="waiting"><span class="spinner"></span><span id="wait-text">Ждём соперника…</span></div>
      </div>

      <p id="lobby-status" class="status"></p>
    </div>
  </section>

  <!-- ИГРА -->
  <section id="screen-game" class="screen" hidden>
    <header class="topbar">
      <div class="brand">Покер <em>вдвоём</em></div>
      <div class="info"><span id="hand-no"></span><i id="luck-dot"></i><span class="sep">·</span><span id="blinds"></span></div>
      <div class="emojis" id="emojis">
        <button data-e="❤️">❤️</button><button data-e="😘">😘</button><button data-e="😂">😂</button><button data-e="😎">😎</button><button data-e="🔥">🔥</button><button data-e="😭">😭</button>
        <button id="btn-sound" class="sound" title="Звук">🔊</button>
      </div>
    </header>

    <main class="table-area">
      <div class="table">
        <div class="felt">
          <div class="seat seat-op" id="seat-op">
            <div class="plate">
              <div class="avatar" id="op-avatar"></div>
              <div class="pinfo"><div class="pname" id="op-name"></div><div class="pstack" id="op-stack"></div></div>
              <div class="bubble" id="op-bubble"></div>
              <div class="dealer-btn" id="op-dealer">D</div>
            </div>
            <div class="hole" id="op-cards"></div>
          </div>
          <div class="bet-spot bet-op" id="op-bet"></div>

          <div class="center">
            <div class="emblem" id="emblem"><span class="r">♥</span> Покер вдвоём <span>♠</span></div>
            <div class="board" id="board"></div>
            <div class="pot" id="pot"></div>
          </div>
          <div class="result" id="result"></div>

          <div class="bet-spot bet-me" id="me-bet"></div>
          <div class="seat seat-me" id="seat-me">
            <div class="hole" id="me-cards"></div>
            <div class="plate">
              <div class="avatar" id="me-avatar"></div>
              <div class="pinfo"><div class="pname" id="me-name"></div><div class="pstack" id="me-stack"></div></div>
              <div class="bubble" id="me-bubble"></div>
              <div class="dealer-btn" id="me-dealer">D</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="controls" id="controls"></footer>
  </section>

  <div id="float-layer"></div>
  <div id="overlay" hidden></div>
  <div id="luck-panel" hidden></div>
  <div id="toast"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="poker.js"></script>
  <script src="app.js"></script>
</body>
</html>
